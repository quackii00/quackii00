name: Generate Snake Animation

on:
  schedule:
    # Chạy tự động vào lúc 00:00 mỗi ngày
    - cron: "0 0 * * *"
  workflow_dispatch: # Cho phép bấm chạy thủ công
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Chạy action tạo ảnh SVG
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          # Xuất ra file SVG nền tối, rắn màu xanh neon
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FFFF

      # 2. Đẩy ảnh vừa tạo lên nhánh "output"
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
