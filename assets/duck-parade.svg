<svg viewBox="0 0 800 96" width="100%" height="96" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    .parade {
      animation: march 18s steps(360) infinite;
    }
    .hop-1 {
      animation: pixelHop 0.4s steps(2, end) infinite;
    }
    .hop-2 {
      animation: pixelHop 0.4s steps(2, end) 0.1s infinite;
    }
    .hop-3 {
      animation: pixelHop 0.4s steps(2, end) 0.2s infinite;
    }
    .hop-4 {
      animation: pixelHop 0.4s steps(2, end) 0.3s infinite;
    }
    .legs-a {
      animation: toggleA 0.4s steps(1, end) infinite;
    }
    .legs-b {
      animation: toggleB 0.4s steps(1, end) infinite;
    }
    .chat-1 {
      animation: showChat1 4s steps(1, end) infinite;
    }
    .chat-2 {
      animation: showChat2 4s steps(1, end) infinite;
    }
    @keyframes march {
      0% { transform: translateX(820px); }
      100% { transform: translateX(-340px); }
    }
    @keyframes pixelHop {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    @keyframes toggleA {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes toggleB {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes showChat1 {
      0%, 10%, 85%, 100% { opacity: 0; }
      15%, 75% { opacity: 1; }
    }
    @keyframes showChat2 {
      0%, 35%, 95%, 100% { opacity: 0; }
      40%, 90% { opacity: 1; }
    }
    .pixel-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #0D1117;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- 8-bit Pixel Ground Line -->
  <rect x="40" y="84" width="720" height="2" fill="#1F2937" />
  <rect x="80" y="88" width="12" height="2" fill="#00E5FF" opacity="0.4" />
  <rect x="240" y="88" width="8" height="2" fill="#D946EF" opacity="0.4" />
  <rect x="420" y="88" width="14" height="2" fill="#00E5FF" opacity="0.4" />
  <rect x="610" y="88" width="10" height="2" fill="#D946EF" opacity="0.4" />

  <defs>
    <!-- 16-bit Pixel Art Duck Sprite (1px = 1 unit, scaled via transform) -->
    <g id="pixel-duck">
      <!-- Dark Pixel Outline (#111827) -->
      <path fill="#111827" d="
        M5,0 h5 v1 h-5 z
        M4,1 h1 v1 h-1 z M10,1 h1 v4 h-1 z
        M3,2 h1 v2 h-1 z
        M0,4 h3 v1 h-3 z
        M0,5 h1 v1 h-1 z M1,6 h2 v1 h-2 z
        M3,6 h1 v1 h-1 z M11,5 h3 v1 h-3 z M14,4 h2 v2 h-2 z
        M15,6 h1 v3 h-1 z
        M3,7 h1 v3 h-1 z
        M14,9 h1 v1 h-1 z
        M4,10 h1 v1 h-1 z M13,10 h1 v1 h-1 z
        M5,11 h8 v1 h-8 z
      " />

      <!-- Yellow Head & Body Fill (#FDE047) -->
      <path fill="#FDE047" d="
        M5,1 h5 v1 h-5 z
        M4,2 h6 v3 h-6 z
        M4,5 h6 v1 h-6 z
        M4,6 h10 v1 h-10 z
        M14,5 h1 v1 h-1 z
        M4,7 h11 v2 h-11 z
        M4,9 h10 v1 h-10 z
      " />

      <!-- Shaded Lower Belly & Wing (#FACC15 & #EAB308) -->
      <path fill="#FACC15" d="
        M5,10 h8 v1 h-8 z
        M7,7 h5 v1 h-5 z
        M12,8 h2 v1 h-2 z
      " />
      <path fill="#EAB308" d="
        M7,8 h5 v1 h-5 z
        M8,9 h4 v1 h-4 z
      " />

      <!-- White Eye Sparkle & Dark Pupil -->
      <rect x="5" y="3" width="2" height="2" fill="#111827" />
      <rect x="5" y="3" width="1" height="1" fill="#FFFFFF" />

      <!-- Pink Pixel Cheek (#FB7185) -->
      <rect x="7" y="5" width="2" height="1" fill="#FB7185" />

      <!-- Orange Pixel Beak (#F97316) -->
      <path fill="#F97316" d="
        M1,5 h3 v1 h-3 z
        M2,6 h1 v1 h-1 z
      " />

      <!-- Walking Feet Frame A -->
      <g class="legs-a" fill="#F97316">
        <rect x="6" y="12" width="1" height="2" />
        <rect x="5" y="13" width="2" height="1" />
        <rect x="10" y="12" width="1" height="1" />
      </g>

      <!-- Walking Feet Frame B -->
      <g class="legs-b" fill="#F97316">
        <rect x="6" y="12" width="1" height="1" />
        <rect x="10" y="12" width="1" height="2" />
        <rect x="9" y="13" width="2" height="1" />
      </g>
    </g>
  </defs>

  <g class="parade">
    <!-- 8-Bit Speech Bubble 1: "quack quack~" -->
    <g class="chat-1" transform="translate(0, 6)">
      <!-- Pixel border -->
      <rect x="2" y="0" width="96" height="22" fill="#111827" />
      <rect x="0" y="2" width="100" height="18" fill="#111827" />
      <!-- Inner fill -->
      <rect x="2" y="2" width="96" height="18" fill="#00E5FF" />
      <!-- Pixel tail -->
      <rect x="24" y="22" width="6" height="2" fill="#00E5FF" />
      <rect x="22" y="24" width="4" height="2" fill="#00E5FF" />
      <text x="50" y="15" text-anchor="middle" class="pixel-text">quack quack~</text>
    </g>

    <!-- 8-Bit Speech Bubble 2: "bye bye! <3" -->
    <g class="chat-2" transform="translate(136, 12)">
      <rect x="2" y="0" width="88" height="22" fill="#111827" />
      <rect x="0" y="2" width="92" height="18" fill="#111827" />
      <rect x="2" y="2" width="88" height="18" fill="#FDE047" />
      <rect x="26" y="22" width="6" height="2" fill="#FDE047" />
      <rect x="24" y="24" width="4" height="2" fill="#FDE047" />
      <text x="46" y="15" text-anchor="middle" class="pixel-text">bye bye! &lt;3</text>
    </g>

    <!-- Mama Pixel Duck (3x scale -> 48x42px) -->
    <g transform="translate(12, 42)">
      <g class="hop-1">
        <use href="#pixel-duck" transform="scale(3)" />
      </g>
    </g>

    <!-- Baby Pixel Duck 1 (2x scale -> 32x28px) -->
    <g transform="translate(76, 56)">
      <g class="hop-2">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>

    <!-- Baby Pixel Duck 2 (2x scale) -->
    <g transform="translate(118, 56)">
      <g class="hop-3">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>

    <!-- Baby Pixel Duck 3 (2x scale) -->
    <g transform="translate(160, 56)">
      <g class="hop-4">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>
  </g>
</svg>
