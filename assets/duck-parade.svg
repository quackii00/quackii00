<svg viewBox="0 0 800 96" width="100%" height="96" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    .parade {
      animation: march 18s steps(360) infinite;
    }
    .hop-1 {
      animation: pixelHop 0.4s steps(2, end) infinite;
    }
    .hop-2 {
      animation: pixelHop 0.4s steps(2, end) 0.1s infinite;
    }
    .hop-3 {
      animation: pixelHop 0.4s steps(2, end) 0.2s infinite;
    }
    .hop-4 {
      animation: pixelHop 0.4s steps(2, end) 0.3s infinite;
    }
    .legs-a {
      animation: toggleA 0.4s steps(1, end) infinite;
    }
    .legs-b {
      animation: toggleB 0.4s steps(1, end) infinite;
    }
    .chat-1 {
      animation: showChat1 4s steps(1, end) infinite;
    }
    .chat-2 {
      animation: showChat2 4s steps(1, end) infinite;
    }
    @keyframes march {
      0% { transform: translateX(820px); }
      100% { transform: translateX(-340px); }
    }
    @keyframes pixelHop {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    @keyframes toggleA {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes toggleB {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes showChat1 {
      0%, 10%, 85%, 100% { opacity: 0; }
      15%, 75% { opacity: 1; }
    }
    @keyframes showChat2 {
      0%, 35%, 95%, 100% { opacity: 0; }
      40%, 90% { opacity: 1; }
    }
    .pixel-text-cyan {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: 0.5px;
    }
    .pixel-text-yellow {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #FDE047;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- 8-bit Pixel Ground Line -->
  <rect x="40" y="84" width="720" height="2" fill="#1F2937" />
  <rect x="80" y="88" width="12" height="2" fill="#00E5FF" opacity="0.4" />
  <rect x="240" y="88" width="8" height="2" fill="#D946EF" opacity="0.4" />
  <rect x="420" y="88" width="14" height="2" fill="#00E5FF" opacity="0.4" />
  <rect x="610" y="88" width="10" height="2" fill="#D946EF" opacity="0.4" />

  <defs>
    <!-- Chubby / Plump Pixel Art Duck Sprite -->
    <g id="pixel-duck">
      <!-- Dark Pixel Outline (#111827) -->
      <path fill="#111827" d="
        M4,0 h6 v1 h-6 z
        M3,1 h1 v1 h-1 z M10,1 h1 v1 h-1 z
        M2,2 h1 v2 h-1 z M11,2 h1 v2 h-1 z
        M0,4 h2 v2 h-2 z
        M12,4 h3 v1 h-3 z M15,3 h1 v1 h-1 z
        M16,4 h1 v5 h-1 z
        M1,6 h1 v4 h-1 z
        M2,10 h1 v1 h-1 z M15,9 h1 v2 h-1 z
        M3,11 h12 v1 h-12 z
      " />

      <!-- Plump Yellow Head & Chubby Body Fill (#FDE047) -->
      <path fill="#FDE047" d="
        M4,1 h6 v1 h-6 z
        M3,2 h8 v2 h-8 z
        M3,4 h9 v1 h-9 z
        M15,4 h1 v1 h-1 z
        M2,5 h14 v4 h-14 z
        M3,9 h12 v1 h-12 z
      " />

      <!-- Round Chubby Belly & Wing Shading (#FACC15 & #EAB308) -->
      <path fill="#FACC15" d="
        M3,10 h12 v1 h-12 z
        M2,9 h1 v1 h-1 z
        M7,6 h6 v1 h-6 z
        M13,7 h2 v2 h-2 z
      " />
      <path fill="#EAB308" d="
        M7,7 h6 v1 h-6 z
        M8,8 h5 v1 h-5 z
      " />

      <!-- Eye & Highlight -->
      <rect x="4" y="3" width="2" height="2" fill="#111827" />
      <rect x="4" y="3" width="1" height="1" fill="#FFFFFF" />

      <!-- Rosy Cheek (#FB7185) -->
      <rect x="6" y="5" width="2" height="1" fill="#FB7185" />

      <!-- Orange Pixel Beak (#F97316) -->
      <path fill="#F97316" d="
        M0,4 h3 v1 h-3 z
        M1,5 h2 v1 h-2 z
      " />

      <!-- Walking Feet Frame A -->
      <g class="legs-a" fill="#F97316">
        <rect x="6" y="12" width="1" height="2" />
        <rect x="5" y="13" width="2" height="1" />
        <rect x="11" y="12" width="1" height="1" />
      </g>

      <!-- Walking Feet Frame B -->
      <g class="legs-b" fill="#F97316">
        <rect x="6" y="12" width="1" height="1" />
        <rect x="11" y="12" width="1" height="2" />
        <rect x="10" y="13" width="2" height="1" />
      </g>
    </g>
  </defs>

  <g class="parade">
    <!-- Floating Pixel Text 1 (No bubble background) -->
    <g class="chat-1" transform="translate(8, 28)">
      <text x="0" y="0" class="pixel-text-cyan">quack quack~</text>
    </g>

    <!-- Floating Pixel Text 2 (No bubble background) -->
    <g class="chat-2" transform="translate(132, 36)">
      <text x="0" y="0" class="pixel-text-yellow">bye bye!</text>
    </g>

    <!-- Mama Chubby Pixel Duck (3x scale) -->
    <g transform="translate(12, 42)">
      <g class="hop-1">
        <use href="#pixel-duck" transform="scale(3)" />
      </g>
    </g>

    <!-- Baby Chubby Pixel Duck 1 (2x scale) -->
    <g transform="translate(82, 56)">
      <g class="hop-2">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>

    <!-- Baby Chubby Pixel Duck 2 (2x scale) -->
    <g transform="translate(126, 56)">
      <g class="hop-3">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>

    <!-- Baby Chubby Pixel Duck 3 (2x scale) -->
    <g transform="translate(170, 56)">
      <g class="hop-4">
        <use href="#pixel-duck" transform="scale(2)" />
      </g>
    </g>
  </g>
</svg>
