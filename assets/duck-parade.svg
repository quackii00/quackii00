<svg viewBox="0 0 800 110" width="100%" height="110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .parade {
      animation: walkAcross 16s linear infinite;
    }
    .waddle-1 {
      animation: bob 0.55s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }
    .waddle-2 {
      animation: bob 0.55s ease-in-out 0.15s infinite alternate;
      transform-origin: center bottom;
    }
    .waddle-3 {
      animation: bob 0.55s ease-in-out 0.3s infinite alternate;
      transform-origin: center bottom;
    }
    .waddle-4 {
      animation: bob 0.55s ease-in-out 0.45s infinite alternate;
      transform-origin: center bottom;
    }
    .foot-l {
      animation: stepL 0.55s ease-in-out infinite alternate;
    }
    .foot-r {
      animation: stepR 0.55s ease-in-out infinite alternate;
    }
    .bubble-1 {
      animation: pop1 4s ease-in-out infinite;
    }
    .bubble-2 {
      animation: pop2 4s ease-in-out infinite;
    }
    .note {
      animation: floatNote 2s ease-in-out infinite;
    }
    @keyframes walkAcross {
      0% { transform: translateX(850px); }
      100% { transform: translateX(-420px); }
    }
    @keyframes bob {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }
    @keyframes stepL {
      0% { transform: translateY(0px) rotate(10deg); }
      100% { transform: translateY(-4px) rotate(-15deg); }
    }
    @keyframes stepR {
      0% { transform: translateY(-4px) rotate(-15deg); }
      100% { transform: translateY(0px) rotate(10deg); }
    }
    @keyframes pop1 {
      0%, 10%, 90%, 100% { opacity: 0; transform: translateY(4px) scale(0.9); }
      20%, 75% { opacity: 1; transform: translateY(0px) scale(1); }
    }
    @keyframes pop2 {
      0%, 35%, 95%, 100% { opacity: 0; transform: translateY(4px) scale(0.9); }
      45%, 85% { opacity: 1; transform: translateY(0px) scale(1); }
    }
    @keyframes floatNote {
      0%, 100% { transform: translateY(0px); opacity: 0.85; }
      50% { transform: translateY(-5px); opacity: 1; }
    }
    .bubble-text {
      font-family: 'Fira Code', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #0D1117;
    }
  </style>

  <!-- Subtle glowing ground trail -->
  <line x1="40" y1="98" x2="760" y2="98" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.3" />

  <defs>
    <!-- Mama Duck (Facing Left) -->
    <g id="mama-duck">
      <!-- Legs -->
      <path class="foot-l" d="M 24 78 L 24 88 L 16 90" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path class="foot-r" d="M 35 78 L 35 88 L 27 90" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Body -->
      <path d="M 12 62 C 12 48, 32 46, 44 52 C 54 56, 58 49, 60 47 C 62 56, 56 78, 34 78 C 16 78, 12 70, 12 62 Z" fill="#FACC15" />
      <!-- Cute Wing -->
      <path d="M 26 57 C 36 55, 45 60, 42 68 C 38 72, 26 70, 24 63 Z" fill="#EAB308" />
      <!-- Head -->
      <circle cx="22" cy="40" r="16" fill="#FACC15" />
      <!-- Little Head Tuft -->
      <path d="M 22 24 C 20 18, 25 18, 25 23 C 27 19, 30 21, 27 25" fill="#FACC15" stroke="#FACC15" stroke-width="1.5" stroke-linecap="round" />
      <!-- Beak -->
      <path d="M 7 38 C 1 38, 1 44, 8 45 L 12 44 Z" fill="#F97316" />
      <!-- Eye -->
      <circle cx="16" cy="37" r="2.6" fill="#1E293B" />
      <circle cx="15.2" cy="36" r="0.9" fill="#FFFFFF" />
      <!-- Rosy Cheek -->
      <ellipse cx="21" cy="43" rx="3.5" ry="2" fill="#FB7185" opacity="0.65" />
    </g>

    <!-- Baby Duckling (Facing Left) -->
    <g id="baby-duck">
      <!-- Legs -->
      <path class="foot-l" d="M 18 79 L 18 87 L 12 88.5" stroke="#F97316" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path class="foot-r" d="M 26 79 L 26 87 L 20 88.5" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Body -->
      <path d="M 9 67 C 9 57, 24 56, 33 60 C 40 63, 42 58, 44 57 C 45 64, 41 80, 25 80 C 12 80, 9 73, 9 67 Z" fill="#FDE047" />
      <!-- Wing -->
      <path d="M 20 64 C 27 63, 33 66, 31 72 C 28 75, 20 73, 18 68 Z" fill="#FACC15" />
      <!-- Head -->
      <circle cx="17" cy="51" r="12" fill="#FDE047" />
      <!-- Tuft -->
      <path d="M 17 39 C 16 35, 20 35, 19 39" stroke="#FDE047" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Beak -->
      <path d="M 5 50 C 1 50, 1 54, 6 55 L 9 54 Z" fill="#F97316" />
      <!-- Eye -->
      <circle cx="12.5" cy="49" r="2" fill="#1E293B" />
      <circle cx="12" cy="48.3" r="0.7" fill="#FFFFFF" />
      <!-- Rosy Cheek -->
      <ellipse cx="16.5" cy="53.5" rx="2.6" ry="1.5" fill="#FB7185" opacity="0.65" />
    </g>
  </defs>

  <g class="parade">
    <!-- Speech Bubble 1: "quack quack~" -->
    <g class="bubble-1" transform="translate(8, 4)">
      <rect x="0" y="0" width="106" height="24" rx="12" fill="#00E5FF" />
      <polygon points="24,24 30,24 22,31" fill="#00E5FF" />
      <text x="53" y="16" text-anchor="middle" class="bubble-text">quack quack~</text>
    </g>

    <!-- Speech Bubble 2: "bye bye! ♡" -->
    <g class="bubble-2" transform="translate(152, 12)">
      <rect x="0" y="0" width="96" height="24" rx="12" fill="#FDE047" />
      <polygon points="32,24 38,24 30,31" fill="#FDE047" />
      <text x="48" y="16" text-anchor="middle" class="bubble-text">bye bye! ♡</text>
    </g>

    <!-- Mama Duck leading -->
    <g transform="translate(10, 6)">
      <g class="waddle-1">
        <use href="#mama-duck" />
      </g>
    </g>

    <!-- Baby Duck 1 -->
    <g transform="translate(85, 8)">
      <g class="waddle-2">
        <use href="#baby-duck" />
      </g>
    </g>

    <!-- Baby Duck 2 -->
    <g transform="translate(142, 8)">
      <g class="waddle-3">
        <use href="#baby-duck" />
      </g>
    </g>

    <!-- Baby Duck 3 (with little cyan bow/sparkle) -->
    <g transform="translate(199, 8)">
      <g class="waddle-4">
        <use href="#baby-duck" />
      </g>
      <text x="44" y="46" font-size="12" fill="#00E5FF" class="note">♪</text>
    </g>
  </g>
</svg>
